name: Ideia ou melhoria
description: Sugira um recurso novo ou uma mudança
labels: ["ideia"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve
      description: Conte a situação de uso. Entender o problema ajuda mais do que a solução pronta.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que você considerou
  - type: checkboxes
    id: ajuda
    attributes:
      label: Contribuição
      options:
        - label: Posso ajudar a implementar
