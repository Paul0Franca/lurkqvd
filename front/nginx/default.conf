# nginx do LurkQVD: serve o front e repassa /api/ para a API (mesma origem: sem CORS).
# Em produção, coloque um proxy com HTTPS na frente (veja o README).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # cadastro de carga com consulta grande é o maior corpo esperado
    client_max_body_size 2m;

    # ---- API -----------------------------------------------------------
    location /api/ {
        include /etc/nginx/seguranca.conf;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # estimativa de tamanho e testes de conexão podem levar alguns segundos
        proxy_read_timeout 120s;
    }

    # ---- arquivos com hash no nome: cache longo --------------------------
    location /assets/ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- app (rotas por hash: tudo cai no index.html) ---------------------
    location / {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
