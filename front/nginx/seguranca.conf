# Cabeçalhos de segurança, incluídos em cada location (um add_header dentro de location
# apaga os herdados do server, por isso vêm de um arquivo só).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Sem scripts de terceiros nem inline. Estilos inline: o React usa style={...}.
# img-src https: fotos de perfil antigas (login com Google) ainda podem estar salvas.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
